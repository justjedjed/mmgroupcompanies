<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="M'M Group of Companies - Explore M Debt Corporation, M'M Commercial Building, Michaela's Arabic Restobar and MM Hotel Tandag."
    />
    <meta name="theme-color" content="#050505" />
    <title>MM Companies | Websites</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="image/m.png" />
  </head>

  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <header id="site-header">
      <button
        class="nav-toggle"
        aria-label="Toggle navigation menu"
        aria-expanded="false"
        aria-controls="primary-nav"
      >
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <nav id="primary-nav" aria-label="Primary">
        <a href="landing.html">Home</a>
        <a href="index.html" class="active" aria-current="page">Websites</a>
        <a href="fb-pages.html">FB Pages</a>
      </nav>
    </header>

    <main
      id="main-content"
      class="slider"
      role="region"
      aria-label="Company showcase slider"
      aria-roledescription="carousel"
    >
      <div class="list">
        <!-- 1. M Debt Corporation -->
        <div
          class="item"
          role="group"
          aria-roledescription="slide"
          aria-label="1 of 4"
        >
          <img
            src="./image/mdcfront.JPG"
            alt="M Debt Corporation building exterior"
            loading="eager"
            fetchpriority="high"
          />
          <div class="content">
            <div class="title">M Debt Corporation</div>
            <div class="type">
              Finding the best solution in achieving your business dreams
            </div>
            <div class="button">
              <button
                onclick="
                  window.open(
                    'https://mdebtcorporation.mmgroupcompanies.com/',
                    '_blank',
                  )
                "
                aria-label="Visit M Debt Corporation website"
              >
                Visit
              </button>
            </div>
          </div>
        </div>

        <div
          class="item"
          role="group"
          aria-roledescription="slide"
          aria-label="2 of 4"
        >
          <img
            src="./image/mmcb.png"
            alt="M'M Commercial Building facade"
            loading="lazy"
          />
          <div class="content">
            <div class="title">M'M Commercial Building</div>
            <div class="type">Elevate Your Aspirations</div>
            <div class="button">
              <button
                onclick="
                  window.open(
                    'https://mmcommercialbuilding.mmgroupcompanies.com/',
                    '_blank',
                  )
                "
                aria-label="Visit M'M Commercial Building website"
              >
                Visit
              </button>
            </div>
          </div>
        </div>

        <div
          class="item"
          role="group"
          aria-roledescription="slide"
          aria-label="3 of 4"
        >
          <img
            src="./image/MAR.jpg"
            alt="Michaela's Arabic Restobar interior and food"
            loading="lazy"
          />
          <div class="content">
            <div class="title">Michaela's Arabic Restobar</div>
            <div class="type">Arabian Flavors. Modern Vibes.</div>
            <div class="button">
              <button
                onclick="
                  window.open(
                    'https://michaelasarabicrestobar.mmgroupcompanies.com/',
                    '_blank',
                  )
                "
                aria-label="Visit Michaela's Arabic Restobar website"
              >
                Visit
              </button>
            </div>
          </div>
        </div>

        <div
          class="item"
          role="group"
          aria-roledescription="slide"
          aria-label="4 of 4"
        >
          <img
            src="./image/mmhotel.png"
            alt="MM Hotel Tandag exterior"
            loading="lazy"
          />
          <div class="content">
            <div class="title">MM Hotel Tandag</div>
            <div class="type">Experience the Best of Tandag</div>
            <div class="button">
              <button
                onclick="
                  window.open(
                    'https://mmhoteltandag.mmgroupcompanies.com/',
                    '_blank',
                  )
                "
                aria-label="Visit MM Hotel Tandag website"
              >
                Visit
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- /.list -->

      <div class="thumbnail" role="tablist" aria-label="Slide thumbnails">
        <div
          class="item active"
          role="tab"
          aria-selected="true"
          aria-label="Show M Debt Corporation"
          tabindex="0"
        >
          <img src="./image/mdcfront.JPG" alt="Thumbnail M Debt Corporation" />
        </div>
        <div
          class="item"
          role="tab"
          aria-selected="false"
          aria-label="Show M'M Commercial Building"
          tabindex="0"
        >
          <img src="./image/mmcb.png" alt="Thumbnail M'M Commercial Building" />
        </div>
        <div
          class="item"
          role="tab"
          aria-selected="false"
          aria-label="Show Michaela's Arabic Restobar"
          tabindex="0"
        >
          <img
            src="./image/MAR.jpg"
            alt="Thumbnail Michaela's Arabic Restobar"
          />
        </div>
        <div
          class="item"
          role="tab"
          aria-selected="false"
          aria-label="Show MM Hotel Tandag"
          tabindex="0"
        >
          <img src="./image/mmhotel.png" alt="Thumbnail MM Hotel" />
        </div>
      </div>

      <div class="nextPrevArrows" aria-label="Slider controls">
        <button class="prev" aria-label="Previous slide">&lt;</button>
        <button class="next" aria-label="Next slide">&gt;</button>
      </div>

      <div class="progress-dots" aria-hidden="true">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
