<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="M'M Group of Companies" />
    <meta
      name="description"
      content="M'M Group of Companies — Explore our official websites: M Debt Corporation, M'M Commercial Building, Michaela's Arabic Restobar and MM Hotel Tandag."
    />
    <link rel="canonical" href="https://mmgroupcompanies.com/index.html" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="M'M Group of Companies" />
    <meta
      property="og:title"
      content="M'M Group of Companies | Official Websites"
    />
    <meta
      property="og:description"
      content="Discover the four pillars of M'M Group — finance, commercial leasing, hospitality and dining in Tandag."
    />
    <meta property="og:url" content="https://mmgroupcompanies.com/index.html" />
    <meta
      property="og:image"
      content="https://mmgroupcompanies.com/image/mdcfront.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="M'M Group of Companies | Official Websites"
    />
    <meta
      name="twitter:description"
      content="Explore M Debt Corporation, M'M Commercial Building, Michaela's Arabic Restobar and MM Hotel Tandag."
    />
    <meta
      name="twitter:image"
      content="https://mmgroupcompanies.com/image/mdcfront.jpg"
    />

    <title>M'M Group of Companies | Official Websites</title>

    <!-- Performance: preconnect & fonts (replaces @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload LCP image -->
    <link
      rel="preload"
      as="image"
      href="image/mdcfront.jpg"
      imagesrcset="image/mdcfront.jpg"
      fetchpriority="high"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="image/m.png" />
    <link rel="apple-touch-icon" href="image/m.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "M'M Group of Companies",
        "url": "https://mmgroupcompanies.com",
        "logo": "https://mmgroupcompanies.com/image/m.png",
        "description": "Hospitality, commercial leasing, dining and financial services in Tandag City.",
        "sameAs": [
          "https://www.facebook.com/profile.php?id=61581063833927",
          "https://www.facebook.com/profile.php?id=61573910346368",
          "https://www.facebook.com/profile.php?id=61583191125175",
          "https://www.facebook.com/profile.php?id=61585706755256"
        ],
        "subOrganization": [
          {
            "@type": "Organization",
            "name": "M Debt Corporation",
            "url": "https://mdebtcorporation.mmgroupcompanies.com/"
          },
          {
            "@type": "Organization",
            "name": "M'M Commercial Building",
            "url": "https://mmcommercialbuilding.mmgroupcompanies.com/"
          },
          {
            "@type": "Organization",
            "name": "Michaela's Arabic Restobar",
            "url": "https://michaelasarabicrestobar.mmgroupcompanies.com/"
          },
          {
            "@type": "Organization",
            "name": "MM Hotel Tandag",
            "url": "https://mmhoteltandag.mmgroupcompanies.com/"
          }
        ]
      }
    </script>
  </head>

  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <header id="site-header">
      <button
        class="nav-toggle"
        type="button"
        aria-label="Toggle navigation menu"
        aria-expanded="false"
        aria-controls="primary-nav"
      >
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <nav id="primary-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="landing.html" class="active" aria-current="page">Websites</a>
        <a href="fb-pages.html">FB Pages</a>
      </nav>
    </header>

    <main
      id="main-content"
      class="slider"
      role="region"
      aria-label="Company showcase slider"
      aria-roledescription="carousel"
    >
      <div class="list">
        <!-- 1. M Debt Corporation -->
        <div
          class="item"
          role="group"
          aria-roledescription="slide"
          aria-label="1 of 4"
        >
          <img
            src="image/mdcfront.jpg"
            width="1920"
            height="1080"
            alt="M Debt Corporation building exterior"
            decoding="async"
            fetchpriority="high"
          />
          <div class="content">
            <div class="title">M Debt Corporation</div>
            <div class="type">
              Finding the best solution in achieving your business dreams
            </div>
            <div class="button">
              <a
                href="https://mdebtcorporation.mmgroupcompanies.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-visit"
                aria-label="Visit M Debt Corporation website (opens in new tab)"
                >Visit</a
              >
            </div>
          </div>
        </div>

        <div
          class="item"
          role="group"
          aria-roledescription="slide"
          aria-label="2 of 4"
        >
          <img
            src="image/mmcb.png"
            width="1920"
            height="1080"
            alt="M'M Commercial Building facade"
            loading="lazy"
            decoding="async"
          />
          <div class="content">
            <div class="title">M'M Commercial Building</div>
            <div class="type">Elevate Your Aspirations</div>
            <div class="button">
              <a
                href="https://mmcommercialbuilding.mmgroupcompanies.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-visit"
                aria-label="Visit M'M Commercial Building website (opens in new tab)"
                >Visit</a
              >
            </div>
          </div>
        </div>

        <div
          class="item"
          role="group"
          aria-roledescription="slide"
          aria-label="3 of 4"
        >
          <img
            src="image/mar.jpg"
            width="1920"
            height="1080"
            alt="Michaela's Arabic Restobar interior and food"
            loading="lazy"
            decoding="async"
          />
          <div class="content">
            <div class="title">Michaela's Arabic Restobar</div>
            <div class="type">Arabian Flavors. Modern Vibes.</div>
            <div class="button">
              <a
                href="https://michaelasarabicrestobar.mmgroupcompanies.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-visit"
                aria-label="Visit Michaela's Arabic Restobar website (opens in new tab)"
                >Visit</a
              >
            </div>
          </div>
        </div>

        <div
          class="item"
          role="group"
          aria-roledescription="slide"
          aria-label="4 of 4"
        >
          <img
            src="image/mmhotel.png"
            width="1920"
            height="1080"
            alt="MM Hotel Tandag exterior"
            loading="lazy"
            decoding="async"
          />
          <div class="content">
            <div class="title">MM Hotel Tandag</div>
            <div class="type">Experience the Best of Tandag</div>
            <div class="button">
              <a
                href="https://mmhoteltandag.mmgroupcompanies.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-visit"
                aria-label="Visit MM Hotel Tandag website (opens in new tab)"
                >Visit</a
              >
            </div>
          </div>
        </div>
      </div>

      <div class="thumbnail" role="tablist" aria-label="Slide thumbnails">
        <button
          class="item active"
          role="tab"
          aria-selected="true"
          aria-label="Show M Debt Corporation"
          type="button"
        >
          <img
            src="image/mdcfront.jpg"
            width="105"
            height="145"
            alt=""
            loading="lazy"
            decoding="async"
          />
        </button>
        <button
          class="item"
          role="tab"
          aria-selected="false"
          aria-label="Show M'M Commercial Building"
          type="button"
        >
          <img
            src="image/mmcb.png"
            width="105"
            height="145"
            alt=""
            loading="lazy"
            decoding="async"
          />
        </button>
        <button
          class="item"
          role="tab"
          aria-selected="false"
          aria-label="Show Michaela's Arabic Restobar"
          type="button"
        >
          <img
            src="image/mar.jpg"
            width="105"
            height="145"
            alt=""
            loading="lazy"
            decoding="async"
          />
        </button>
        <button
          class="item"
          role="tab"
          aria-selected="false"
          aria-label="Show MM Hotel Tandag"
          type="button"
        >
          <img
            src="image/mmhotel.png"
            width="105"
            height="145"
            alt=""
            loading="lazy"
            decoding="async"
          />
        </button>
      </div>

      <div class="nextPrevArrows" aria-label="Slider controls">
        <button class="prev" type="button" aria-label="Previous slide">
          &lt;
        </button>
        <button class="next" type="button" aria-label="Next slide">&gt;</button>
      </div>

      <div class="progress-dots" aria-hidden="true">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </main>

    <noscript>
      <style>
        .slider .list .item:not(:first-child) {
          display: none;
        }
        .thumbnail,
        .nextPrevArrows {
          display: none !important;
        }
      </style>
      <p
        style="
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: #111;
          color: #f6d878;
          text-align: center;
          padding: 10px;
        "
      >
        Enable JavaScript for the full slider experience.
      </p>
    </noscript>

    <script src="app.js" defer></script>
  </body>
</html>
